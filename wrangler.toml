# Cloudflare Worker 配置（静态资源 + 动态路由）
#
# 背景：原 Pages 项目里 functions/ 上传后从不执行（连 12 行的 /api/ping 都返回首页 HTML）。
#      改成 Worker + Assets 绑定后，Worker 能跑（POST /api/checkout 返回真实单号），
#      但默认「静态资源优先」，dist/api/cart 这类文件会把动态路由抢走。
#      所以必须开 run_worker_first，让 Worker 先处理，再按需回落到静态资源。

# ⚠️ Worker 已删除（2026-11-23），只保留 Pages 部署。
# 如需重建 Worker，取消下两行注释并执行 wrangler deploy。
name = "tw-momo"
# main = "worker.js"
compatibility_date = "2026-11-01"

# [assets]
# directory = "dist"
# binding = "ASSETS"
# 关键：先跑 Worker，未命中再交给静态资源（next() → env.ASSETS.fetch）
# run_worker_first = true

# Pages 构建配置（Git 集成仍需要）
pages_build_output_dir = "dist"
