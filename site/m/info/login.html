<title>登入 / 註冊 - momo購物網</title>
<script>
(function(){
  var K=['utm_source','utm_medium','utm_campaign','utm_term','utm_content',
         'utm_id','fbclid','ttclid','gclid','adset_id','campaign_id',
         'sub1','sub2','sub3','sub4','sub5'];
  function grab(q){var o={},p=(q||'').replace(/^\?/,'').split('&');for(var i=0;i<p.length;i++){
    var kv=p[i].split('=');if(kv.length<2)continue;try{var k=decodeURIComponent(kv[0]);
    if(K.indexOf(k)!==-1)o[k]=decodeURIComponent(kv.slice(1).join('='));}catch(e){}}return o;}
  function load(){try{return JSON.parse(sessionStorage.getItem('bp_utm')||'{}')}catch(e){return {}}}
  function save(o){try{sessionStorage.setItem('bp_utm',JSON.stringify(o))}catch(e){}
    try{var d=new Date();d.setTime(d.getTime()+7*864e5);
    document.cookie='bp_utm='+encodeURIComponent(JSON.stringify(o))+'; expires='+d.toUTCString()+'; path=/; SameSite=Lax';}catch(e){}}
  var cur=load(),add=false;
  var m=grab(location.search); for(var a in m){cur[a]=m[a];add=true}
  try{var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];
    if(n&&n.name){var mm=grab(n.name.split('?')[1]||'');for(var b in mm){cur[b]=mm[b];add=true}}}catch(e){}
  try{if(document.referrer){var mm2=grab((document.referrer.split('?')[1])||'');
    for(var c in mm2){if(!cur[c]){cur[c]=mm2[c];add=true}}}}catch(e){}
  if(add)save(cur);
  window.__BP_UTM__=cur;
})();
</script>

<div class="auth">
  <div class="auth__tabs">
    <button type="button" data-tab="login" class="on">登入</button>
    <button type="button" data-tab="register">註冊新帳號</button>
  </div>

  <div class="auth__pane" data-pane="login">
    <label>手機號碼</label>
    <input id="loginPhone" inputmode="numeric" maxlength="10" placeholder="09xxxxxxxx" autocomplete="username">
    <label>密碼</label>
    <input id="loginPwd" type="password" placeholder="請輸入密碼" autocomplete="current-password">
    <button type="button" class="auth__btn" id="doLogin">登入</button>
  </div>

  <div class="auth__pane" data-pane="register" hidden>
    <label>手機號碼 <i>*</i></label>
    <input id="regPhone" inputmode="numeric" maxlength="10" placeholder="09xxxxxxxx" autocomplete="username">
    <label>密碼 <i>*</i>（至少 6 碼）</label>
    <input id="regPwd" type="password" placeholder="設定密碼" autocomplete="new-password">
    <label>姓名</label>
    <input id="regName" placeholder="選填" autocomplete="name">
    <label>電子郵件</label>
    <input id="regEmail" type="email" placeholder="選填" autocomplete="email">
    <button type="button" class="auth__btn" id="doRegister">註冊並登入</button>
  </div>

  <div id="authMsg" class="auth__msg"></div>

  <p class="auth__hint">本站為 momo 復刻示範站，帳號資料僅儲存於本站，不會外傳。</p>
</div>

    </div>
  </section>
</main>
