<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商品詳情 - momo購物網</title>
<link rel="stylesheet" href="/assets/www.momoshop.com.tw/search/_next/static/css/b36616395eb7bd31.css">
<link rel="stylesheet" href="/assets/www.momoshop.com.tw/search/_next/static/css/62f82080ec5074dd.css">
<link rel="stylesheet" href="/assets/www.momoshop.com.tw/search/_next/static/css/046394d9bcfe3529.css">
<link rel="stylesheet" href="/assets/image.momoshop.com.tw/ecm/font/theme-main.css">
<link rel="stylesheet" href="/assets/css/momo-pages.css">
<link rel="stylesheet" href="/assets/css/momo-mobile.css">
<style>
  body { background: #f5f5f5; margin: 0; }
  .spa-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .spa-card { background: #fff; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: 380px 1fr; gap: 28px; }
  .spa-img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fafafa; border-radius: 6px; }
  .spa-name { font-size: 20px; font-weight: 700; color: #333; line-height: 1.45; margin: 0 0 12px; }
  .spa-price { display: flex; align-items: baseline; gap: 10px; margin: 14px 0; }
  .spa-price b { font-size: 34px; color: #d62872; font-family: var(--font-price, sans-serif); }
  .spa-price s { font-size: 14px; color: #999; }
  .spa-off { background: #ffe8f2; color: #d62872; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .spa-meta { font-size: 13px; color: #888; line-height: 2; }
  .spa-skus { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
  .spa-sku { border: 1px solid #ddd; border-radius: 4px; padding: 8px 14px; font-size: 13px; cursor: pointer; background: #fff; }
  .spa-sku.on { border-color: #d62872; background: #fdf0f6; color: #d62872; font-weight: 700; }
  .spa-btns { display: flex; gap: 10px; margin-top: 16px; }
  .spa-btn { flex: 1; height: 48px; border-radius: 24px; border: 0; font-size: 16px; font-weight: 700; cursor: pointer; }
  .spa-btn--buy { background: #d62872; color: #fff; }
  .spa-btn--cart { background: #fff; color: #d62872; border: 1px solid #d62872; }
  .spa-loading { padding: 60px 20px; text-align: center; color: #888; }
  @media (max-width: 720px) {
    .spa-card { grid-template-columns: 1fr; gap: 14px; padding: 14px; }
    .spa-name { font-size: 16px; }
    .spa-price b { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="spa-wrap">
  <nav class="crumb" style="font-size:12px;color:#999;margin-bottom:10px">
    <a href="/" style="color:#027bff;text-decoration:none">首頁</a> /
    <a href="/category/" style="color:#027bff;text-decoration:none">商品分類</a> /
    <span id="spaCrumb">商品詳情</span>
  </nav>
  <div id="spaRoot" class="spa-loading">載入中…</div>
</div>

<script>
(function () {
  var code = (location.pathname.match(/\/product\/(\d+)/) || [])[1] || '';
  var root = document.getElementById('spaRoot');
  var state = { item: null, skus: [], cur: 0 };

  function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
  function sale(p) { return Math.round(Number(p) / 2); }

  function paint() {
    var it = state.item;
    if (!it) {
      root.className = '';
      root.innerHTML = '<div class="spa-card"><div class="spa-loading">查無此商品（' + code + '）<br><br>' +
        '<a href="/category/" style="color:#d62872">← 回商品分類</a></div></div>';
      return;
    }
    var sku = state.skus[state.cur] || it;
    var price = sale(sku.price || it.price);
    var orig = sku.price || it.price;
    var img = sku.img || it.img;

    var skuHtml = '';
    if (state.skus.length > 1) {
      skuHtml = '<div class="spa-meta">規格</div><div class="spa-skus">' +
        state.skus.map(function (s, i) {
          return '<div class="spa-sku' + (i === state.cur ? ' on' : '') + '" data-i="' + i + '">' +
            (s.label || s.name.slice(0, 12)) + ' <b style="color:#d62872">$' + fmt(sale(s.price)) + '</b></div>';
        }).join('') + '</div>';
    }

    root.className = '';
    root.innerHTML =
      '<div class="spa-card">' +
        '<img class="spa-img" src="' + img + '" alt="">' +
        '<div>' +
          '<h1 class="spa-name">' + (it.name || '') + '</h1>' +
          '<div class="spa-meta">' +
            (it.cat ? '分類：' + it.cat + (it.sub ? ' / ' + it.sub : '') : '') +
          '</div>' +
          '<div class="spa-price"><b>$' + fmt(price) + '</b><s>$' + fmt(orig) + '</s>' +
            '<span class="spa-off">5 折</span></div>' +
          skuHtml +
          '<div class="spa-meta">商品編號：' + (sku.code || it.code) + '　|　滿 $490 免運　|　10 天猶豫期</div>' +
          '<div class="spa-btns">' +
            '<button class="spa-btn spa-btn--cart" id="spaAdd">加入購物車</button>' +
            '<button class="spa-btn spa-btn--buy" id="spaBuy">立即結帳</button>' +
          '</div>' +
          '<div style="margin-top:14px;font-size:12px;color:#999">本站為復刻示範站，資料取自公開商品頁。</div>' +
        '</div>' +
      '</div>';

    document.getElementById('spaCrumb').textContent = (it.name || '').slice(0, 20);
    document.title = (it.name || '商品') + ' - momo購物網';

    root.querySelectorAll('.spa-sku').forEach(function (b) {
      b.addEventListener('click', function () {
        state.cur = Number(b.getAttribute('data-i'));
        paint();
      });
    });

    function add() {
      var cart = [];
      try { cart = JSON.parse(localStorage.getItem('momo_cart') || '[]'); } catch (e) {}
      var c = sku.code || it.code;
      var hit = cart.find(function (x) { return x.code === c; });
      if (hit) hit.qty = (hit.qty || 1) + 1;
      else cart.push({ code: c, name: sku.name || it.name, price: price, img: img, qty: 1 });
      localStorage.setItem('momo_cart', JSON.stringify(cart));
    }
    document.getElementById('spaAdd').addEventListener('click', function () {
      add();
      this.textContent = '已加入 ✓';
      var self = this;
      setTimeout(function () { self.textContent = '加入購物車'; }, 1200);
    });
    document.getElementById('spaBuy').addEventListener('click', function () {
      add();
      location.href = '/checkout/';
    });
  }

  if (!code) { paint(); return; }

  fetch('/data/catalog.json')
    .then(function (r) { return r.json(); })
    .then(function (cat) {
      var it = (cat.items || []).find(function (x) { return String(x.code) === code; });
      state.item = it || null;
      state.skus = (it && it.skus && it.skus.length > 1) ? it.skus : [];
      state.cur = 0;
      if (state.skus.length) {
        var i = state.skus.findIndex(function (s) { return String(s.code) === code; });
        if (i >= 0) state.cur = i;
      }
      paint();
    })
    .catch(function () {
      state.item = null;
      paint();
    });
})();
</script>
</body>
</html>
